DISTRO = "gatewayos"
DISTRO_NAME = "Gateway Linux Distribution"
DISTRO_VERSION = "1.0"

# Use systemd as init manager
INIT_MANAGER = "systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# Distro features
DISTRO_FEATURES = "ext2 ipv4 ipv6 largefile systemd usbgadget usbhost vpp pam virtualization polkit security pulseaudio i2c-tools curl gzip nano apache2 alsa-lib alsa-utils nano usbutils"
DISTRO_FEATURES:remove = "rpm"

DISTRO = "mono-dev"
DISTRO_NAME = "Mono Gateway Linux Distribution"
DISTRO_VERSION = "1.0"


# Use systemd as init manager
INIT_MANAGER = "systemd"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

# Distro features
DISTRO_FEATURES = "ext2 ipv4 ipv6 largefile systemd usbgadget usbhost vpp pam virtualization polkit security"